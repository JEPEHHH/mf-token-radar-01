<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar — Pre-Token Valuation &amp; Farm Desk</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.6" opacity="0.35"/>
          <circle cx="16" cy="16" r="8.5" stroke="currentColor" stroke-width="1.6" opacity="0.6"/>
          <circle cx="16" cy="16" r="3" fill="currentColor"/>
          <path d="M16 16L25.5 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="23.5" cy="9.5" r="2.2" fill="#B4690E"/>
        </svg>
      </div>
      <div>
        <div class="brand-kicker">DEFILLAMA SEALED SNAPSHOT · OFFLINE RESEARCH DESK</div>
        <h1>Token Launch Radar</h1>
      </div>
    </div>
    <div class="masthead-right">
      <div class="meta-pills" id="meta-pills"></div>
      <nav class="view-tabs" aria-label="Primary views">
        <button type="button" class="tab-btn active" data-view="board">Pre-Token Radar</button>
        <button type="button" class="tab-btn" data-view="live">Live Benchmarks</button>
        <button type="button" class="tab-btn" data-view="calibration">Peer Multiples</button>
        <button type="button" class="tab-btn" data-view="sandbox">Model Sandbox</button>
      </nav>
    </div>
  </header>

  <section class="kpi-grid" id="kpi-grid" aria-label="Summary metrics"></section>

  <section class="formula-band" id="formula-band" aria-label="Valuation methodology"></section>

  <section class="workspace" id="workspace">
    <div class="main-pane" id="main-pane">
      <div class="toolbar" id="toolbar"></div>
      <div class="active-filters" id="active-filters" hidden></div>
      <div class="table-card" id="view-container"></div>
      <div class="pager" id="pager"></div>
    </div>
    <aside class="detail-pane" id="detail-pane" aria-label="Protocol detail" hidden></aside>
  </section>

  <footer class="foot">
    <span>Implied values are model estimates derived solely from snapshot TVL, live peer ratios, 7d growth, operating age, and chain count. No token launch is guaranteed.</span>
    <span id="foot-source"></span>
  </footer>
</div>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
